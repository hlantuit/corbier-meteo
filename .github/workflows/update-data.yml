name: Update data

# All live forecasts are fetched by the visitor's browser. This workflow only refreshes the
# slower products that are baked into data/ (verification, archive, map vectors, satellite snow,
# multi-system seasonal forecast) and commits them; GitHub Pages then republishes the site.
on:
  schedule:
    - cron: '17 5 * * *'    # daily 05:17 UTC: archive + Météo-France snow depth
    - cron: '43 11 * * *'   # daily 11:43 UTC: Sentinel-2 snow map (after the morning overpass)
    - cron: '41 3 * * 1'    # Mondays 03:41 UTC: model verification
    - cron: '29 4 2 * *'    # 2nd of each month: buildings, lifts, pistes
    - cron: '11 6 14 * *'   # 14th of each month: C3S multi-system seasonal forecast
  workflow_dispatch:
    inputs:
      what:
        description: 'What to update (all, climate, snow, verification, vectors, seasonal)'
        default: 'all'
        required: true

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decide what to run
        id: plan
        run: |
          W="${{ github.event.inputs.what }}"
          S="${{ github.event.schedule }}"
          [ -z "$W" ] && case "$S" in
            '17 5 * * *') W=climate ;;
            '43 11 * * *') W=snow ;;
            '41 3 * * 1') W=verification ;;
            '29 4 2 * *') W=vectors ;;
            '11 6 14 * *') W=seasonal ;;
          esac
          echo "what=$W" >> "$GITHUB_OUTPUT"
          echo "Running: $W"

      - name: Archive and snow depth
        if: steps.plan.outputs.what == 'all' || steps.plan.outputs.what == 'climate'
        continue-on-error: true
        run: node scripts/update-climate.mjs

      - name: Model verification (about 6 minutes)
        if: steps.plan.outputs.what == 'all' || steps.plan.outputs.what == 'verification'
        continue-on-error: true
        run: node scripts/update-verification.mjs

      - name: Buildings, lifts, pistes
        if: steps.plan.outputs.what == 'all' || steps.plan.outputs.what == 'vectors'
        continue-on-error: true
        run: node scripts/update-vectors.mjs

      - name: Sentinel-2 snow map
        if: steps.plan.outputs.what == 'all' || steps.plan.outputs.what == 'snow'
        continue-on-error: true
        run: |
          pip install --quiet rasterio numpy pillow requests
          python scripts/update_snowcover.py

      - name: C3S multi-system seasonal forecast
        if: steps.plan.outputs.what == 'all' || steps.plan.outputs.what == 'seasonal'
        continue-on-error: true
        env:
          ECMWF_DATASTORE_KEY: ${{ secrets.ECMWF_DATASTORE_KEY }}
        run: |
          pip install --quiet "cdsapi>=0.7.4" xarray netCDF4
          python scripts/update_seasonal_c3s.py

      - name: Commit
        run: |
          git config user.name "corbier-meteo bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update data (${{ steps.plan.outputs.what }})"
          git pull --rebase --autostash
          git push
