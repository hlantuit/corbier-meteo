name: Update data

# All live forecasts are fetched by the visitor's browser (and again every 30 minutes while the page
# stays open). This workflow refreshes what is baked into data/ (AI bulletin, archive, satellite image,
# verification, map vectors, multi-system seasonal forecast) and commits it; GitHub Pages then
# republishes the site. Scheduled runs are free for a public repository; the hourly commits also keep
# GitHub from pausing the schedule after 60 days without activity.
on:
  schedule:
    - cron: '13 * * * *'      # hourly: resort report + AI-written bulletin (off the busy top of the hour)
    - cron: '17 5,17 * * *'   # twice a day: archive + Météo-France snow depth
    - cron: '43 11,15 * * *'  # twice a day: Sentinel-2 image (after the late-morning overpass)
    - cron: '41 3 * * 1,4'    # Mondays and Thursdays: model verification
    - cron: '23 2 * * 0'      # Sundays: snowpack calibration over past winters (Météo-France snow depths)
    - cron: '29 4 2 * *'      # 2nd of each month: buildings, lifts, pistes
    - cron: '11 6 14 * *'     # 14th of each month: C3S multi-system seasonal forecast
  workflow_dispatch:
    inputs:
      what:
        description: 'What to update, one or several separated by spaces (all, climate, snow, verification, vectors, seasonal, bulletin, resort, snowcal)'
        default: 'all'
        required: true

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decide what to run
        id: plan
        run: |
          W="${{ github.event.inputs.what }}"
          S="${{ github.event.schedule }}"
          [ -z "$W" ] && case "$S" in
            '13 * * * *') W=bulletin ;;
            '17 5,17 * * *') W=climate ;;
            '43 11,15 * * *') W=snow ;;
            '41 3 * * 1,4') W=verification ;;
            '23 2 * * 0') W=snowcal ;;
            '29 4 2 * *') W=vectors ;;
            '11 6 14 * *') W=seasonal ;;
          esac
          echo "what=$W" >> "$GITHUB_OUTPUT"
          echo "Running: $W"

      - name: Archive and snow depth (each resort at its own base elevation)
        if: contains(format(' {0} ', steps.plan.outputs.what), ' all ') || contains(format(' {0} ', steps.plan.outputs.what), ' climate ')
        continue-on-error: true
        run: |
          for s in $(node -e "import('./assets/js/config.js').then(m => console.log(m.SITE_IDS.join(' ')))"); do
            SITE_ID=$s node scripts/update-climate.mjs || echo "::warning::climate failed for $s"
          done

      - name: Model verification (about 6 minutes)
        if: contains(format(' {0} ', steps.plan.outputs.what), ' all ') || contains(format(' {0} ', steps.plan.outputs.what), ' verification ')
        continue-on-error: true
        run: node scripts/update-verification.mjs

      - name: Snowpack calibration over past winters (about 2 minutes)
        if: contains(format(' {0} ', steps.plan.outputs.what), ' all ') || contains(format(' {0} ', steps.plan.outputs.what), ' snowcal ')
        continue-on-error: true
        run: node scripts/calibrate-snowpack.mjs

      - name: Buildings, lifts, pistes
        if: contains(format(' {0} ', steps.plan.outputs.what), ' all ') || contains(format(' {0} ', steps.plan.outputs.what), ' vectors ')
        continue-on-error: true
        run: node scripts/update-vectors.mjs

      - name: Sentinel-2 snow map
        if: contains(format(' {0} ', steps.plan.outputs.what), ' all ') || contains(format(' {0} ', steps.plan.outputs.what), ' snow ')
        continue-on-error: true
        run: |
          pip install --quiet rasterio numpy pillow requests
          python scripts/update_snowcover.py

      - name: C3S multi-system seasonal forecast
        if: contains(format(' {0} ', steps.plan.outputs.what), ' all ') || contains(format(' {0} ', steps.plan.outputs.what), ' seasonal ')
        continue-on-error: true
        env:
          ECMWF_DATASTORE_KEY: ${{ secrets.ECMWF_DATASTORE_KEY }}
        run: |
          pip install --quiet "cdsapi>=0.7.4" xarray netCDF4
          python scripts/update_seasonal_c3s.py

      - name: Resort report (le-corbier.com) and avalanche danger
        if: contains(format(' {0} ', steps.plan.outputs.what), ' all ') || contains(format(' {0} ', steps.plan.outputs.what), ' bulletin ') || contains(format(' {0} ', steps.plan.outputs.what), ' resort ')
        continue-on-error: true
        run: node scripts/update-resort.mjs

      - name: AI-written bulletin (OpenAI-compatible API, configured by secrets; skipped when none)
        if: contains(format(' {0} ', steps.plan.outputs.what), ' all ') || contains(format(' {0} ', steps.plan.outputs.what), ' bulletin ')
        continue-on-error: true
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_URL: ${{ vars.AI_API_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
        run: |
          for s in $(node -e "import('./assets/js/config.js').then(m => console.log(m.SITE_IDS.join(' ')))"); do
            SITE_ID=$s node scripts/update-bulletin.mjs || echo "::warning::bulletin failed for $s"
          done

      - name: Commit
        run: |
          git config user.name "corbier-meteo bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update data (${{ steps.plan.outputs.what }})"
          git pull --rebase --autostash
          git push
